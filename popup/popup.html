<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>Doomn't</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1E1E1E"/><rect x="26" y="16" width="48" height="18" rx="4" fill="#F4F3EF"/><rect x="26" y="41" width="48" height="18" rx="4" fill="#F4F3EF" opacity="0.4"/><rect x="26" y="66" width="48" height="18" rx="4" fill="#F4F3EF" opacity="0.15"/><rect x="12" y="47" width="76" height="6" rx="3" fill="#FF4F1A"/></svg>
  <span class="name">Doomn't</span>
</header>
<div class="label" data-i18n="today">今天</div>
<section class="stats" id="stats" aria-live="polite">
  <div class="stat-total">
    <span class="stat-total-time" id="totalTime"></span>
    <span class="stat-delta" id="totalDelta"></span>
  </div>
  <div class="stat-sites" id="sites"></div>
  <div class="stat-week-label" data-i18n="last7">最近 7 天</div>
  <div class="stat-week" id="week" role="img"></div>
</section>
<div class="label" data-i18n="settings">設定</div>
<div class="sites">
  <details class="site-group">
    <summary><span class="title">YouTube</span><span class="health-dot" data-health-dot="youtube"></span></summary>
    <div class="group-body">
      <div class="health" data-health="youtube"></div>
      <label class="row">
        <span class="text">
          <span class="title" data-i18n="grayTitle">灰階模式</span>
          <span class="desc" data-i18n="grayDesc">整個網站變成黑白，包含影片和圖片</span>
        </span>
        <input type="checkbox" id="grayYoutube" role="switch">
      </label>
    </div>
  </details>
  <details class="site-group">
    <summary><span class="title">Instagram</span><span class="health-dot" data-health-dot="instagram"></span></summary>
    <div class="group-body">
      <div class="health" data-health="instagram"></div>
      <label class="row">
        <span class="text">
          <span class="title" data-i18n="grayTitle">灰階模式</span>
          <span class="desc" data-i18n="grayDesc">整個網站變成黑白，包含影片和圖片</span>
        </span>
        <input type="checkbox" id="grayInstagram" role="switch">
      </label>
      <label class="row">
        <span class="text">
          <span class="title" data-i18n="igSuggestTitle">藏起 Instagram 推薦帳號</span>
          <span class="desc" data-i18n="igSuggestDesc">首頁右側的推薦帳號和上面你自己的帳號，其餘內容置中</span>
        </span>
        <input type="checkbox" id="igSuggest" role="switch">
      </label>
      <label class="row">
        <span class="text">
          <span class="title" data-i18n="igDmTitle">藏起 Instagram 訊息按鈕</span>
          <span class="desc" data-i18n="igDmDesc">右下角的「訊息」浮動按鈕</span>
        </span>
        <input type="checkbox" id="igDm" role="switch">
      </label>
    </div>
  </details>
  <details class="site-group">
    <summary><span class="title">4chan</span><span class="health-dot" data-health-dot="fourchan"></span></summary>
    <div class="group-body">
      <div class="health" data-health="fourchan"></div>
      <label class="row">
        <span class="text">
          <span class="title" data-i18n="grayTitle">灰階模式</span>
          <span class="desc" data-i18n="grayDesc">整個網站變成黑白，包含影片和圖片</span>
        </span>
        <input type="checkbox" id="grayFourchan" role="switch">
      </label>
      <label class="row">
        <span class="text">
          <span class="title" data-i18n="fourchanTitle">4chan 過濾</span>
          <span class="desc" data-i18n="fourchanDesc">藏起成人看板和 Misc（/pol/ 除外），熱門討論串只顯示 SFW</span>
        </span>
        <input type="checkbox" id="fourchan" role="switch">
      </label>
    </div>
  </details>
</div>
<label class="row lang-row">
  <span class="title" data-i18n="language">語言</span>
  <select id="lang">
    <option value="zh">繁體中文</option>
    <option value="en">English</option>
  </select>
</label>
<script src="../common/i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
